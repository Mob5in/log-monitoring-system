# ===== Application =====
spring.application.name=log-monitor

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/logmonitor
spring.datasource.username=logmonitor
spring.datasource.password=logmonitor
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# update: auto-creates/updates tables based on your @Entity classes (fine for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092

# Producer (used by the File Ingester subsystem)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer (used by the Rule Evaluator subsystem)
spring.kafka.consumer.group-id=log-monitor-rule-evaluator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===== Custom app config (you'll read these in your own @ConfigurationProperties later) =====
# Folder that the File Ingester watches for new log files
app.logs.folder=./logs

# Kafka topic name used to publish/consume log entries
app.kafka.topic.logs=raw-logs

# Path to the rules config file (used by Rule Evaluator)
app.rules.config-path=./rules.yml

# ===== Server =====
server.port=8080