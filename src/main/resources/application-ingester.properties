# Active only when running with --spring.profiles.active=ingester
# An ingester-only instance doesn't serve HTTP and doesn't touch the database,
# so we skip starting an embedded web server and skip DB/JPA autoconfiguration
# entirely -> faster startup, no wasted connections.
#
# NOTE: these are Spring Boot 4.x class paths (autoconfigure was split into
# per-feature modules in Boot 4 - different from the org.springframework.boot.autoconfigure.*
# paths used in Boot 3.x and earlier).

spring.main.web-application-type=none

spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration